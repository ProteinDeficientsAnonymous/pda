name: CI

on:
  pull_request:
  merge_group:
  push:
    # agent branches get CI before a PR exists; keep in sync with post-push-ci-reminder.py
    branches: [main, "claude/**", "feat-*", "fix-*", "chore-*"]

# Cancel older runs of the same branch when a new push arrives — the latest
# commit is the one we care about.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Postgres 16 — matches docker-compose.yml for local dev. SQLite doesn't
    # support JSONField `contains` lookups or pg_notify (SSE), so a handful
    # of tests only pass against Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pda
          POSTGRES_PASSWORD: pda
          POSTGRES_DB: pda
        ports:
          - 5432:5432
        # tmpfs: per-worker test DB migrations and TRUNCATEs are fsync-bound on disk
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pda:pda@localhost:5432/pda
      SECRET_KEY: ci-only-not-used-in-prod

    steps:
      # full history on PRs so diff-cover can diff against the base branch
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # lint first so ruff's rewrites don't race pytest/ty; -Oline keeps pytest output live
      - name: Run backend CI
        run: make agent-lint && make -j --keep-going --output-sync=line agent-backend-ci

      # agent-lint auto-fixes with ruff; fail if anything was reformatted so
      # contributors format locally instead of relying on CI to silently fix.
      - name: Fail if the working tree is dirty
        run: git diff --exit-code

      - name: Diff coverage (changed lines must be at least 80% covered)
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVER_BASE: origin/${{ github.base_ref }}
        run: make agent-diff-coverage-backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run frontend CI
        run: make agent-frontend-ci

      # uvx runs diff-cover without installing the backend's Python deps
      - uses: astral-sh/setup-uv@v7
        if: github.event_name == 'pull_request'

      - name: Diff coverage (changed lines must be at least 80% covered)
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVER_BASE: origin/${{ github.base_ref }}
        run: make agent-diff-coverage-frontend

  # Matches Dockerfile `pnpm build:docker`. E2E stays on the Vite dev server.
  frontend-production-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build production frontend
        run: cd frontend && pnpm build:docker

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    # Playwright specs drive the real app end-to-end, including the SSE
    # comment live-update path, which needs pg_notify — Postgres, not SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pda
          POSTGRES_PASSWORD: pda
          POSTGRES_DB: pda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pda:pda@localhost:5432/pda
      SECRET_KEY: ci-only-not-used-in-prod
      # The live uvicorn server enforces ALLOWED_HOSTS (unlike pytest's test
      # client), so the e2e job must allow the hosts Playwright hits.
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(cd frontend && pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell

      # No --with-deps: the runner has chromium's libs; the apt step only added fonts and sometimes crawled for minutes
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && pnpm exec playwright install --only-shell chromium

      # Only migrate — each spec seeds its own data via the e2e_seed command;
      # the global demo seed isn't needed and would just add a failure surface.
      - name: Migrate database
        run: cd backend && uv run python manage.py migrate

      # DatabaseCache's table isn't a migration; entrypoint.sh/dev scripts create
      # it separately and this job needs the same step or rate-limited endpoints 500.
      - name: Create cache table
        run: cd backend && uv run python manage.py createcachetable

      # Start both servers and run the specs in a single step: background
      # processes started in one step aren't guaranteed to survive into the
      # next, so serving and testing must share a step.
      - name: Run e2e tests
        run: |
          (cd backend && uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000) &
          # Vite dev (not preview): only the dev server proxies /api, including
          # the SSE stream with buffering disabled. A preview build would break
          # the live-update spec.
          (cd frontend && pnpm dev --host 0.0.0.0 --port 3000) &
          wait_for() {
            for _ in $(seq 1 60); do
              curl -sf "$1" > /dev/null && return 0
              sleep 1
            done
            echo "timed out waiting for $1" >&2
            return 1
          }
          wait_for http://localhost:8000/api/openapi.json
          wait_for http://localhost:3000
          make agent-frontend-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  anti-tampering:
    name: Anti-tampering
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # the checkout is the PR merged into main's tip; its first parent scopes diffs to this PR alone
      - name: Resolve the base commit
        run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      # A PR must not be able to weaken the gate that judges it: run the base branch's copy.
      - name: Load gate scripts from the base branch
        run: |
          for f in scripts/check_anti_tampering.py scripts/check_diff_tampering.py; do
            git checkout "$BASE_SHA" -- "$f" 2>/dev/null || echo "::notice::$f is new in this PR; using the PR copy"
          done

      - name: Check for suppressions or skipped tests
        run: python3 scripts/check_anti_tampering.py

      # observe mode: annotates weakened tests and gate-config edits; switch to --enforce once quiet
      - name: Check diff for weakened tests and gate-config edits
        run: python3 scripts/check_diff_tampering.py --base "$BASE_SHA"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout "${{ github.event.pull_request.base.sha }}" -- .gitleaks.toml
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            range="${{ github.event.merge_group.base_sha }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${{ github.event.before }}..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --redact --config .gitleaks.toml --log-opts="$range"

  # observe mode: findings annotate and write a summary; add --enforce once trusted.
  # A mutation run that can't execute fails the job, since it would otherwise test nothing.
  test-strength:
    name: Test strength
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pda
          POSTGRES_PASSWORD: pda
          POSTGRES_DB: pda
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pda:pda@localhost:5432/pda
      SECRET_KEY: ci-only-not-used-in-prod

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # the checkout is the PR merged into main's tip; its first parent scopes diffs to this PR alone
      - name: Resolve the base commit
        run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      # bootstrap: until the base itself base-loads these, its copies predate this interface
      - name: Load test-strength scripts from the base branch
        run: |
          if ! git show "$BASE_SHA:.github/workflows/ci.yml" | grep -q "Load test-strength scripts from the base branch"; then
            echo "::notice::the base branch predates base-loaded test-strength scripts; using the PR copies"
            exit 0
          fi
          for f in scripts/check_fail_to_pass.py scripts/run_mutation.py scripts/list_affected_tests.py; do
            git checkout "$BASE_SHA" -- "$f" 2>/dev/null || echo "::notice::$f is new in this PR; using the PR copy"
          done

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fail-to-pass (fix PRs only)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          shopt -s nocasematch
          if [[ "$PR_TITLE" =~ ^fix(\([^\)]*\))?!?: ]]; then
            python3 scripts/check_fail_to_pass.py --base "$BASE_SHA"
          else
            echo "Not a fix PR; skipping."
          fi

      - name: Diff-scoped mutation testing
        run: python3 scripts/run_mutation.py --base "$BASE_SHA"

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run bandit (high severity)
        run: make sast

  # Scans app lockfiles only. Root package-lock.json is release tooling whose
  # nested `npm` CLI bundles minimatch/glob; those cannot be overridden.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/google/osv-scanner@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source \
            --lockfile=/src/uv.lock \
            --lockfile=/src/frontend/pnpm-lock.yaml
