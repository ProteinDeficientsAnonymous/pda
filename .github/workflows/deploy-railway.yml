name: deploy railway (production)

# Manual production deploys only — staging deploys automatically from
# release.yml after a successful semantic-release run (see deploy-staging job
# there). Pick the ref from the "Run workflow" dropdown (main for normal
# deploys; a tag or older commit for rollbacks).
# Pin matches image pulled 2026-04-20; bump intentionally when upgrading CLI.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_CLI_IMAGE: ghcr.io/railwayapp/cli@sha256:10ff70f5b1d65e6eee8d8b7839b917bc88631efa5b5eddaa33a585a7891b254c

jobs:
  deploy-production:
    name: deploy to railway (production)
    runs-on: ubuntu-latest
    environment: railway-production
    concurrency:
      group: railway-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: print deploy context (no token)
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT_PRODUCTION }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME_PRODUCTION }}
          RAILWAY_CRON_SERVICE_NAMES: ${{ vars.RAILWAY_CRON_SERVICE_NAMES_PRODUCTION }}
        run: |
          set -eu
          deploy_message="$(bash .github/scripts/railway-deploy-message.sh)"
          echo "railway deploy context (production target)"
          echo "  github_ref=${GITHUB_REF}"
          echo "  commit=$(git rev-parse --short=7 HEAD)"
          echo "  deploy_message=${deploy_message}"
          echo "  railway_project_id=${RAILWAY_PROJECT_ID}"
          echo "  railway_environment=${RAILWAY_ENVIRONMENT}"
          echo "  railway_service=${RAILWAY_SERVICE_NAME}"
          echo "  railway_cron_services=${RAILWAY_CRON_SERVICE_NAMES}"
          {
            echo "RAILWAY_DEPLOY_MESSAGE<<EOF"
            printf '%s\n' "${deploy_message}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: railway up (production token only in this job)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT_PRODUCTION }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME_PRODUCTION }}
          RAILWAY_CRON_SERVICE_NAMES: ${{ vars.RAILWAY_CRON_SERVICE_NAMES_PRODUCTION }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN}"
          test -n "${RAILWAY_PROJECT_ID}"
          test -n "${RAILWAY_ENVIRONMENT}"
          test -n "${RAILWAY_SERVICE_NAME}"
          test -n "${RAILWAY_DEPLOY_MESSAGE}"
          docker_run=(docker run --rm --platform linux/amd64
            -v "${GITHUB_WORKSPACE}:/workspace"
            -w /workspace
            -e RAILWAY_TOKEN
            "${RAILWAY_CLI_IMAGE}")
          echo "railway cli version:"
          "${docker_run[@]}" railway --version
          echo "railway deploy message: ${RAILWAY_DEPLOY_MESSAGE}"

          wait_for_deployment() {
            local service="$1" deployment_id="$2" status
            local poll_seconds=10 max_polls=90
            for _ in $(seq 1 "${max_polls}"); do
              status="$("${docker_run[@]}" railway deployment list --json --limit 20 \
                --environment "${RAILWAY_ENVIRONMENT}" \
                --service "${service}" \
                | jq -r --arg id "${deployment_id}" '.[] | select(.id == $id) | .status')" || status=""
              echo "deployment ${deployment_id} status: ${status:-unknown}"
              case "${status}" in
                SUCCESS|SLEEPING) return 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED) return 1 ;;
              esac
              sleep "${poll_seconds}"
            done
            echo "timed out after $((poll_seconds * max_polls))s waiting for deployment ${deployment_id}"
            return 1
          }

          deploy_service() {
            local service="$1" up_log deployment_id
            up_log="$(mktemp)"
            echo "railway up (verbose) for service '${service}' — 404 here often means wrong project id, environment id/name, or service slug for this token"
            if "${docker_run[@]}" railway up --ci --verbose \
              --message "${RAILWAY_DEPLOY_MESSAGE}" \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT}" \
              --service "${service}" 2>&1 | tee "${up_log}"; then
              return 0
            fi
            # the cli exits 1 when it can't stream build logs (e.g. reused cron images) even though the deploy went through
            grep -q "Failed to stream build logs" "${up_log}" || return 1
            deployment_id="$(grep -oE 'id=[0-9a-f-]{36}' "${up_log}" | head -1 | cut -d= -f2)"
            test -n "${deployment_id}" || return 1
            echo "build log stream failed; polling deployment ${deployment_id} instead"
            wait_for_deployment "${service}" "${deployment_id}"
          }

          deploy_service "${RAILWAY_SERVICE_NAME}"

          # RAILWAY_CRON_SERVICE_NAMES_PRODUCTION: comma-separated cron service names, e.g. "cron-daily,cron-checkin-nudges"
          if [ -n "${RAILWAY_CRON_SERVICE_NAMES}" ]; then
            IFS=',' read -ra cron_services <<< "${RAILWAY_CRON_SERVICE_NAMES}"
            for service in "${cron_services[@]}"; do
              deploy_service "${service}"
            done
          fi
