name: Visual

on:
  # Stacks often target another feature branch and never open a pull request
  # into main. Compare those too. The baseline artifact is uploaded only by
  # the push below: reg-actions writes it when the event is not a pull request.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# contents: write pushes the ci__screenshots branch the comment's images live on.
# pull-requests: write posts the diff comment. actions: read lists Visual runs
# and downloads the baseline artifact from main.
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pda
          POSTGRES_PASSWORD: pda
          POSTGRES_DB: pda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pda:pda@localhost:5432/pda
      SECRET_KEY: ci-only-not-used-in-prod
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v6

      # The merge-base is often a [skip ci] release commit, which never uploaded
      # a screenshots artifact. reg-actions then treats every image as new.
      - name: Resolve screenshot baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/screenshot_baseline.py

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: |
          version=$(cd frontend && pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      # The azure mirror sometimes serves these fonts at ~100 kB/s; they affect pixels, so cache, don't skip.
      - name: Cache Playwright apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: playwright-apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-apt-

      - name: Install Playwright system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99playwright-archives
          cd frontend && pnpm exec playwright install-deps chromium
          sudo apt-get autoclean -qq

      # Screenshots run headless, which uses the headless shell, not full Chrome.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && pnpm exec playwright install --only-shell chromium

      - name: Migrate database
        run: cd backend && uv run python manage.py migrate

      - name: Create cache table
        run: cd backend && uv run python manage.py createcachetable

      # uvicorn has to share this step with Playwright. A process started in
      # an earlier step is not still running when the next step starts.
      - name: Capture screenshots
        run: |
          (cd backend && uv run uvicorn config.asgi:application --host 127.0.0.1 --port 8000) &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/openapi.json > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/openapi.json > /dev/null
          cd frontend && pnpm test:visual

      - uses: reg-viz/reg-actions@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-directory-path: frontend/screenshots
          artifact-name: screenshots
          branch: ci__screenshots
          target-hash: ${{ steps.baseline.outputs.sha }}
          comment-mode: changes
          outdated-comment-action: update
          enable-antialias: true
          matching-threshold: 0.1
