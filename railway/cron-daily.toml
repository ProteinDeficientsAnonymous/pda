# INACTIVE: this service's `railwayConfigFile` is unset, so config here is not
# applied. Live config is set directly on the Railway service.
#
# startCommand invokes a script rather than chaining commands inline: Railway
# runs startCommand as exec-form argv, so shell operators like `&&` are passed
# as literal arguments and the container dies in under a second with no log
# output.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh scripts/cron_daily.sh"
cronSchedule = "0 12 * * *"
restartPolicyType = "NEVER"
