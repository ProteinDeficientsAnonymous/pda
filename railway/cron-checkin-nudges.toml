# INACTIVE: not currently wired to the Railway service.
# The `railwayConfigFile` setting was cleared on the cron-checkin-nudges service
# because config-as-code silently reverted every API-side config change. Live
# config is set directly on the service; keep this file in sync by hand, or
# re-point the service at it once the cron execution issue (deployments flagged
# buildOnly, so the start command never runs) is resolved.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "cd backend && uv run python manage.py send_checkin_nudges"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
