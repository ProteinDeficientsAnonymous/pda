# INACTIVE: this service's `railwayConfigFile` is unset, so config here is not
# applied. Live config is set directly on the Railway service.
#
# Note the `sh -c` wrapper: Railway runs startCommand as exec-form argv, so a
# bare `cd x && y` is passed as literal arguments and the container dies in
# under a second with no log output. The wrapper is required for any command
# using shell operators.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"cd backend && uv run --no-dev python manage.py send_checkin_nudges\""
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
