    {% for event in events %}
    <div style="margin: 0 0 24px; padding: 0 0 24px; border-bottom: 1px solid #eee;">
      <p style="margin: 0 0 4px;"><strong>{{ event.title|lower }}</strong></p>
      {% if event.when %}<p style="margin: 0 0 8px; font-size: 14px; color: #666;">{{ event.when|lower }}</p>{% endif %}
      <p style="margin: 0; font-size: 14px;"><a href="{{ event.url }}" style="color: #3c6939;">view event</a></p>
    </div>
    {% endfor %}
